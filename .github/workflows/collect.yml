name: 情報収集

on:
  # 毎日 10:00 JST（＝01:00 UTC）に起動を要求する。
  #
  # ただし GitHub の定時実行は時刻を守らない。実測した遅れ（起動要求が
  # 作られた時刻そのものが遅い。runner の待ちではない）:
  #   2026-08-03  06:00 指定 → 07:06 起動（+66分）
  #   2026-08-04  06:00 指定 → 07:08 起動（+69分）
  #   2026-08-06  11:30 指定 → 14:31 起動（+181分）
  # 収集自体は15〜99秒で終わっており、遅れはすべて GitHub 側。
  # 早めに指定して着地を早める以外に打つ手が無い。
  #
  # 何日おきに実処理するかは RUN_EVERY_N_DAYS でスクリプト側が決める。
  # cron の */2 は月をまたぐと連続実行になるため、この形を崩さないこと。
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: 収集
        env:
          # 1 なら毎日そのまま収集する。間引きに戻すときは 2 に上げる
          RUN_EVERY_N_DAYS: '1'
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
        run: node scripts/collect.mjs

      - name: 変更をコミット
        run: |
          git config user.name  'ultraman-watch[bot]'
          git config user.email 'ultraman-watch@users.noreply.github.com'
          git add docs/data/items.json docs/data/sources.json state/seen.json state/last-run.json
          if git diff --staged --quiet; then
            echo '更新なし'
          else
            git commit -m "収集: $(date -u +%Y-%m-%d)"
            git push
          fi

      # 秘密鍵に触れるのはこのステップだけ。
      # docs/ にデプロイされる成果物とは完全に分離されています。
      - name: 通知
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/notify.mjs
